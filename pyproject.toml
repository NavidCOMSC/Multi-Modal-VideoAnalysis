
[tool.poetry]
name = "video-data-analysis"
version = "0.1.0"
description = "Video data analysis pipeline for Azure microservices"
authors = ["amir.rahimi@uk.zurich.com"]
readme = "README.md"
packages = [{ include = "video_data_analysis" }]

[tool.poetry.dependencies]
python = "^3.11"

# --- Core utilities ---
typing-extensions = "^4.10"
python-dotenv = "^1.0"
httpx = "^0.27"
tenacity = "^8.5"
tqdm = "^4.66"
rich = "^13.7"
msgspec = "^0.18"
pydantic = "^2.7"

# --- LLM / Agents ---
openai = ">=1.40,<2.0"
litellm = ">=1.44,<2.0"
langchain = ">=0.2,<0.4"
langchain-community = ">=0.2,<0.4"
langchain-azure-ai = ">=0.1,<0.3"
langfuse = ">=2.0,<3.0"

# --- Data ---
numpy = "^2.0"
pandas = "^2.2"

# --- Security / parsing ---
cryptography = "^43.0"
pypdf = "^4.3"
extract-msg = "^0.48"
pymongo = "^4.8"

# --- Azure SDK (core runtime deps) ---
azure-core = "^1.30"
azure-identity = "^1.17"
azure-keyvault-secrets = "^4.8"
azure-storage-blob = "^12.21"
azure-storage-queue = "^12.10"
azure-search-documents = "^11.6"

# If you are truly deploying as Azure Functions Python:
azure-functions = "^1.20"


[tool.poetry.group.notebook.dependencies]
ipykernel = "^6.29"
jupyterlab = "^4.2"
notebook = "^7.2"
ipywidgets = "^8.1"

[tool.poetry.group.video.dependencies]
opencv-python-headless = ">=4.10,<5.0"
pillow = "^10.4"

# Video/codec handling (very useful in practice)
av = ">=12,<14"                # PyAV bindings (FFmpeg)
ffmpeg-python = "^0.2"
imageio = "^2.35"
imageio-ffmpeg = "^0.5"

# Common visualisation + analysis
matplotlib = "^3.9"
scikit-image = "^0.24"

[tool.poetry.group.azure.dependencies]
azure-monitor-opentelemetry = "^1.6"
opentelemetry-sdk = "^1.25"
opentelemetry-instrumentation-requests = "^0.46b0"
opentelemetry-instrumentation-httpx = "^0.46b0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
mypy = "^1.11"
ruff = "^0.5"
black = "^24.4"
pre-commit = "^3.8"
types-requests = "^2.32"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"